name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_VERSION: '14'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_techmart
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_techmart" >> $GITHUB_ENV
        echo "DJANGO_SECRET_KEY=test-secret-key-for-ci-cd-pipeline" >> $GITHUB_ENV
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
        echo "OIDC_RP_CLIENT_ID=test-client-id" >> $GITHUB_ENV
        echo "OIDC_RP_CLIENT_SECRET=test-client-secret" >> $GITHUB_ENV
        echo "OIDC_OP_AUTHORIZATION_ENDPOINT=https://test.auth0.com/authorize" >> $GITHUB_ENV
        echo "OIDC_OP_TOKEN_ENDPOINT=https://test.auth0.com/oauth/token" >> $GITHUB_ENV
        echo "OIDC_OP_USER_ENDPOINT=https://test.auth0.com/userinfo" >> $GITHUB_ENV
        echo "OIDC_OP_JWKS_ENDPOINT=https://test.auth0.com/.well-known/jwks.json" >> $GITHUB_ENV
        echo "OIDC_RP_REDIRECT_URI=http://localhost:8001/oidc/callback/" >> $GITHUB_ENV
        echo "OIDC_RP_POST_LOGOUT_REDIRECT_URI=http://localhost:8001/oidc/logout/" >> $GITHUB_ENV
        echo "OIDC_RP_SCOPES=openid email profile" >> $GITHUB_ENV
        echo "AUTH0_DOMAIN=test.auth0.com" >> $GITHUB_ENV
        echo "AUTH0_API_IDENTIFIER=https://techmart-api" >> $GITHUB_ENV
        echo "AUTH0_ALGORITHMS=RS256" >> $GITHUB_ENV
        echo "AFRICASTALKING_USERNAME=test-username" >> $GITHUB_ENV
        echo "AFRICASTALKING_API_KEY=test-api-key" >> $GITHUB_ENV
        echo "EMAIL_HOST_USER=test@example.com" >> $GITHUB_ENV
        echo "EMAIL_HOST_PASSWORD=test-password" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run Django migrations
      run: |
        python manage.py makemigrations --check --dry-run
        python manage.py migrate

    - name: Collect static files
      run: python manage.py collectstatic --noinput

    - name: Run tests
      run: |
        python manage.py test --verbosity=2

    - name: Run linting (optional)
      run: |
        # Install flake8 if not already in requirements.txt
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Render
      run: |
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          echo "⚠️  RENDER_DEPLOY_HOOK secret not set. Skipping deployment."
          echo "To enable deployment:"
          echo "1. Go to your Render service dashboard"
          echo "2. Copy the Deploy Hook URL"
          echo "3. Add it as a GitHub secret named 'RENDER_DEPLOY_HOOK'"
          exit 0
        fi
        
        echo "🚀 Triggering Render deployment..."
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ Deployment triggered successfully!"
        else
          echo "❌ Failed to trigger deployment"
          exit 1
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt

    - name: Run Safety check
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
